name: XCloudPro
options:
  bundleIdPrefix: com.angkonglucio
  deploymentTarget:
    iOS: "16.0"
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: 157.0.0
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: XCloud Pro
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
targets:
  XCloudPro:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: WebRTC
    info:
      path: Info.plist
      properties:
        NSMicrophoneUsageDescription: "XCloud Pro uses the microphone for in-game voice chat during cloud gaming sessions when you choose to enable it."
        CFBundleURLTypes:
          - CFBundleURLName: com.angkonglucio.xcloudpro.xal
            CFBundleURLSchemes:
              - ms-xal-000000004c20a908
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.angkonglucio.xcloudpro
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_GCControllerUserInteractionEnabled: YES
